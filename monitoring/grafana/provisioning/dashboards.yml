apiVersion: 1

# Provider apunta a /var/lib/grafana/dashboards, montado desde
# ./monitoring/grafana/dashboards (ver docker-compose.yml). El directorio existe
# con .gitkeep para que el provider no falle cuando aún no hay dashboards.
providers:
  - name: 'default'
    orgId: 1
    folder: 'CRM'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
