name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for all jobs (H27).
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: crm_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://crm_user:crm_password@localhost:5432/crm_db_test
      JWT_SECRET: test-jwt-secret-that-is-at-least-32-chars!!
      REFRESH_TOKEN_SECRET: test-refresh-secret-that-is-at-least-32-chars!!
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Security audit
        run: |
          cargo install cargo-audit --version 0.21.2 --locked
          cargo audit
      - name: Test
        run: cargo test -- --test-threads=1
      - name: Build
        run: cargo build --release

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: crm_user
          POSTGRES_PASSWORD: crm_password
          POSTGRES_DB: crm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://crm_user:crm_password@localhost:5432/crm_db
      JWT_SECRET: test-jwt-secret-that-is-at-least-32-chars!!
      REFRESH_TOKEN_SECRET: test-refresh-secret-that-is-at-least-32-chars!!
      # Migrations run at backend boot via the tracked runner (RUN_MIGRATIONS).
      RUN_MIGRATIONS: true
      FRONTEND_URL: http://localhost:3000
      BACKEND_PUBLIC_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Build backend
        run: cargo build --release
        working-directory: backend
      - name: Start backend
        run: |
          ../backend/target/release/crm-backend > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health > /dev/null 2>&1; then
              echo "Backend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start:"; tail -50 /tmp/backend.log; exit 1
        env:
          SERVER_PORT: 8000
      - name: Build and start frontend
        run: |
          pnpm build
          (pnpm start > /tmp/frontend.log 2>&1 & echo $! > /tmp/frontend.pid)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start:"; tail -50 /tmp/frontend.log; exit 1
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Run E2E tests
        run: pnpm exec playwright test --project=chromium
        env:
          CI: true
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8000
      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== backend ==="; tail -100 /tmp/backend.log
          echo "=== frontend ==="; tail -100 /tmp/frontend.log
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
